
name: ShelfNote
description: "SimplyNote - A beautiful space for your thoughts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  flutter_quill: ^11.6.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


permission_handler: ^12.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# APP ICON CONFIGURATION
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo_shelfnote.png"
  adaptive_icon_background: "#FCF2EF"
  adaptive_icon_foreground: "assets/icons/app_logo_shelfnote.png"
  remove_alpha_ios: true
